[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-recall"
version = "0.7.0"
description = "Automatic, cheap, precise query of Claude Code session archives via SQLite FTS5 + hooks."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Mark McArthey", email = "markm@learnedgeek.com"},
]
requires-python = ">=3.11"
keywords = [
    "claude",
    "claude-code",
    "session",
    "memory",
    "fts5",
    "hooks",
    "search",
    "semantic-search",
    "ollama",
    "embeddings",
    "rag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
embeddings = [
    "numpy>=1.26",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
claude-recall = "claude_recall.cli:main"

[project.urls]
Homepage = "https://github.com/LearnedGeek/claude-recall"
Repository = "https://github.com/LearnedGeek/claude-recall"
Documentation = "https://github.com/LearnedGeek/claude-recall/blob/main/docs/INTEGRATION-GUIDE.md"
Issues = "https://github.com/LearnedGeek/claude-recall/issues"
Changelog = "https://github.com/LearnedGeek/claude-recall/blob/main/CHANGELOG.md"
Releases = "https://github.com/LearnedGeek/claude-recall/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["claude_recall*"]

[tool.setuptools.package-data]
# Ship hook shell wrappers + (on Windows) the NativeAOT binary as package
# data. setuptools does not auto-include non-Python files in a package
# directory, so they must be listed here explicitly — v0.4.0 was broken
# because this list only had native/* (issue #3).
#
# - hooks/*.ps1, hooks/*.sh: always present; SessionStart always uses the
#   shell wrapper, and on non-Windows on_prompt.{ps1,sh} is the hook path.
# - native/*.exe, native/*.dll: only populated on CI win-x64 builds, but
#   the glob matches zero files on other platforms and that's fine.
claude_recall = [
    "hooks/*.ps1",
    "hooks/*.sh",
    "native/*.exe",
    "native/*.dll",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
