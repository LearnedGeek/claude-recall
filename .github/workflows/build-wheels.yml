name: build-wheels

# Builds platform wheels on tag push. Windows wheel bundles the NativeAOT
# hook binary (src/claude_recall/native/); the any-platform wheel omits it
# and init-hooks falls back to the Python-CLI shell hook.
#
# Triggers:
#   - push to any `v*` tag → build + upload release assets
#   - manual dispatch for debugging

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  build-wheel-win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Read package version from pyproject.toml
        id: pkgver
        # Pulled out so the same version flows into both `dotnet publish
        # /p:Version=...` (so the binary's --version matches the Python
        # package — issue #12) and any future version-dependent steps.
        run: |
          $line = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $line) { throw "version not found in pyproject.toml" }
          $v = $line.Matches[0].Groups[1].Value
          Write-Host "Package version: $v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish NativeAOT hook binary
        # windows-latest has MSVC Build Tools + C++ workload pre-installed;
        # no env-var workaround needed. We run dotnet publish directly rather
        # than build-hook.ps1 to avoid the BuildTools-auto-detect dance.
        run: |
          dotnet publish src/ClaudeRecall.Hook `
            -c Release -r win-x64 --self-contained -nologo `
            /p:Version=${{ steps.pkgver.outputs.version }}
          New-Item -ItemType Directory -Path src/claude_recall/native -Force | Out-Null
          Copy-Item src/ClaudeRecall.Hook/bin/Release/net9.0/win-x64/publish/claude-recall-hook.exe -Destination src/claude_recall/native/ -Force
          Copy-Item src/ClaudeRecall.Hook/bin/Release/net9.0/win-x64/publish/e_sqlite3.dll -Destination src/claude_recall/native/ -Force
          Get-ChildItem src/claude_recall/native | Format-Table Name, Length
          & src/claude_recall/native/claude-recall-hook.exe --version

      - name: Build wheel (tag as win_amd64)
        # setuptools produces `py3-none-any` by default for packages with no
        # compiled Python extensions. Our wheel only contains binary *data*
        # files (the AOT exe), which setuptools classifies as pure. Rename
        # the output so pip's wheel resolver treats it as platform-specific
        # and picks it over the `any` wheel on Windows x64.
        run: |
          python -m build --wheel --outdir dist/
          Get-ChildItem dist/*.whl | ForEach-Object {
            if ($_.Name -like '*py3-none-any*') {
              $new = $_.Name -replace 'py3-none-any', 'py3-none-win_amd64'
              Rename-Item $_.FullName $new
              Write-Host "Renamed $($_.Name) → $new"
            }
          }
          Get-ChildItem dist/*.whl

      - name: C# tests
        # Don't pass --no-build — the AOT publish earlier was Release config;
        # test project still needs its own Debug build.
        run: dotnet test src/ClaudeRecall.Hook.Tests --nologo

      - name: Python tests
        run: |
          pip install -e ".[dev,embeddings]"
          pytest -q

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-win-x64
          path: dist/*.whl

  build-wheel-any:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pure-Python wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-any
          path: dist/*.whl

  release:
    needs: [build-wheel-win-x64, build-wheel-any]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      # `gh release upload` needs either a git repo on disk OR an explicit
      # --repo. v0.4.1 shipped with neither and silently failed to attach
      # wheels. Use --repo explicitly so the job never depends on repo
      # context.
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Ensure GitHub Release exists
        # `gh release upload` requires the release to already exist. Earlier
        # tag pushes failed here because I'd forgotten to `gh release create`
        # before tagging. Create-if-missing makes the workflow self-sufficient.
        # The release-create body is intentionally minimal — owners can
        # edit the release notes after the fact via the GitHub UI.
        run: |
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --notes "Auto-created by build-wheels.yml. See CHANGELOG.md for details; edit these notes after the fact for additional context."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach wheels to GitHub Release
        run: |
          ls -la dist/
          find dist/ -name "*.whl" -print0 | xargs -0 -I{} \
            gh release upload ${{ github.ref_name }} {} \
              --repo ${{ github.repository }} --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    # Upload the freshly-built wheels to PyPI on tag push. Skipped when the
    # PYPI_API_TOKEN secret isn't set (e.g., in a fork or before the owner
    # has registered the package on PyPI), so this never turns CI red for
    # infrastructure reasons.
    needs: [build-wheel-win-x64, build-wheel-any]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      # Optional GitHub Environment for added approval gate; harmless if
      # the environment doesn't exist (GitHub treats it as open).
      name: pypi
      url: https://pypi.org/project/claude-recall/
    permissions:
      # Required if we ever switch to PyPI Trusted Publishing (OIDC).
      # Harmless for the token-based path we start with.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Flatten wheels into dist/
        # download-artifact@v4 puts each artifact in a subdir; twine wants
        # them all in one directory.
        run: |
          mkdir -p flat/
          find dist/ -name "*.whl" -exec cp {} flat/ \;
          ls -la flat/
      - name: Publish to PyPI
        # GitHub Actions disallows `secrets.*` references in step-level `if:`
        # conditions (documented restriction), so we can't gracefully skip
        # on missing token. Instead we rely on pypa/gh-action-pypi-publish
        # to fail loudly with a clear error when no token is available —
        # which is the right behavior for a release operation anyway.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: flat/
          skip-existing: true
